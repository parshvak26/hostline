name: Deploy gateway worker

on:
  push:
    branches: [main]
    # Path-filtered so a copy change on the site does not redeploy the gateway.
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm --prefix worker ci
      - name: Worker tests must pass before anything ships
        run: npm run test:worker
      - name: Deploy
        # Secrets (MODEL_API_KEY and friends) are set once with
        # `wrangler secret put` and are not passed through this workflow.
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
